# Uploads missing from site/ come from production, so pages render without the full pull
# Files the copy writes there itself (compiled theme CSS, generated thumbnails) are served locally
# Mounted only by uncommenting its lines in compose.yaml; an as-found replica or a copy with every upload leaves it out
<Directory /var/www/html/wp-content/uploads>
	RewriteEngine On
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteRule ^(.*)$ ${PRODUCTION_ORIGIN}/wp-content/uploads/$1 [R=302,L]
</Directory>
