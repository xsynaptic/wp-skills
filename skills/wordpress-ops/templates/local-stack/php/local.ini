; Every wp_mail() from the copied database lands here and is dropped
sendmail_path = "cat > /dev/null"

; Set these to live's effective values (Site Health), so a request that runs out of memory or time on live does so here too
; memory_limit =
; max_execution_time =

; The image's opcache-recommended.ini lets a file copied in keep serving its old version for a few seconds; mounted as zz-local.ini to load after it
opcache.revalidate_freq = 0
